name: Update Version
run-name: Move ${{ github.event.inputs.version }} to ${{ github.event.inputs.target }}

# checkov:skip=CKV_GHA_7:Inputs are required for manual triggering of this workflow
on:
  workflow_dispatch:
    inputs:
      target:
        required: true
        description: The tag or reference to use (from)
      version:
        required: true
        description: The version to use (to)

permissions:
  contents: write

jobs:
  update-tag:
    runs-on: ubuntu-latest
    name: Update Tag
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Git Config
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
      - name: Git Tag
        run: git tag -f ${version} ${target}
        env:
          version: ${{ github.event.inputs.version }}
          target: ${{ github.event.inputs.target }}
      - name: Git Push
        run: git push -f origin ${version}
        env:
          version: ${{ github.event.inputs.version }}
