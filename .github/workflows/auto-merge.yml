name: Dependabot Auto-Merge

on:
  pull_request:

permissions: read-all

jobs:
  auto-merge:
    name: Merge
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: fastify/github-action-merge-dependabot@0f445dcd970fbb666d0b0eb15a582820208b68c1
        with:
          target: any
          github-token: ${{ secrets.GITHUB_TOKEN }}
